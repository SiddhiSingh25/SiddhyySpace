<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150" fill="none">
  <defs>
    <linearGradient id="heartRed1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="heartRed2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#450a0a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- Top Small Heart 1 -->
    <g transform="translate(15, 10) rotate(-12, 25, 25)">
      <!-- Sticker White Border -->
      <path d="M 25 38 C 10 25, 2 12, 14 3 C 22 -3, 25 7, 25 7 C 25 7, 28 -3, 36 3 C 48 12, 40 25, 25 38 Z" fill="#ffffff" stroke="#fecdd3" stroke-width="4" stroke-linejoin="round" />
      <!-- Inner Heart -->
      <path d="M 25 35 C 12 23, 5 12, 15 4 C 21 -1, 25 7, 25 7 C 25 7, 29 -1, 35 4 C 45 12, 38 23, 25 35 Z" fill="url(#heartRed1)" />
      <!-- Highlight -->
      <path d="M 12 10 Q 15 5 21 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Top Small Heart 2 (slightly overlapping) -->
    <g transform="translate(65, 20) rotate(15, 20, 20)">
      <!-- Sticker White Border -->
      <path d="M 20 30 C 8 20, 2 10, 11 2 C 18 -3, 20 5, 20 5 C 20 5, 22 -3, 29 2 C 38 10, 32 20, 20 30 Z" fill="#ffffff" stroke="#fecdd3" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Inner Heart -->
      <path d="M 20 28 C 9 18, 4 9, 12 3 C 18 -1, 20 5, 20 5 C 20 5, 22 -1, 28 3 C 36 9, 31 18, 20 28 Z" fill="url(#heartRed2)" />
      <!-- Highlight -->
      <path d="M 10 8 Q 13 4 17 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Main Larger Heart 3 (bottom) -->
    <g transform="translate(25, 65) rotate(-8, 40, 40)">
      <!-- Sticker White Border -->
      <path d="M 40 68 C 16 46, 3 24, 23 6 C 36 -5, 40 12, 40 12 C 40 12, 44 -5, 57 6 C 77 24, 64 46, 40 68 Z" fill="#ffffff" stroke="#fecdd3" stroke-width="5" stroke-linejoin="round" />
      <!-- Inner Heart -->
      <path d="M 40 63 C 18 42, 6 22, 24 6 C 36 -3, 40 12, 40 12 C 40 12, 44 -3, 56 6 C 74 22, 62 42, 40 63 Z" fill="url(#heartRed1)" />
      <!-- Texture lines / highlight -->
      <path d="M 20 18 Q 26 8 36 6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
      <circle cx="20" cy="24" r="2" fill="#ffffff" opacity="0.5" />
    </g>
  </g>
</svg>
