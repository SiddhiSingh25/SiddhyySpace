<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <defs>
    <!-- Hanging line -->
    <linearGradient id="stringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a5b5" />
      <stop offset="100%" stop-color="#d0d5e5" />
    </linearGradient>

    <!-- Sphere Base Gradient -->
    <radialGradient id="ballShade" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <!-- Gloss Overlay -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Hanging wire -->
    <line x1="100" y1="0" x2="100" y2="35" stroke="url(#stringGrad)" stroke-width="2.5" stroke-dasharray="4 2" />

    <!-- Cap at top of disco ball -->
    <rect x="91" y="32" width="18" height="8" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.5" />
    <ellipse cx="100" cy="32" rx="6" ry="2.5" fill="#cbd5e1" />

    <!-- Main Ball Base -->
    <circle cx="100" cy="125" r="82" fill="url(#ballShade)" stroke="#475569" stroke-width="2" />

    <!-- Mirror Grid Facets (Latitude curves) -->
    <path d="M 22 100 Q 100 80 178 100" stroke="#64748b" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 18 115 Q 100 95 182 115" stroke="#64748b" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 18 135 Q 100 155 182 135" stroke="#475569" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 24 150 Q 100 170 176 150" stroke="#475569" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 36 168 Q 100 185 164 168" stroke="#334155" stroke-width="1" fill="none" opacity="0.6" />

    <!-- Mirror Grid Facets (Longitude curves) -->
    <path d="M 100 43 Q 70 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M 100 43 Q 45 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M 100 43 Q 130 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M 100 43 Q 155 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M 100 43 Q 15 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.4" />
    <path d="M 100 43 Q 185 125 100 207" stroke="#475569" stroke-width="1" fill="none" opacity="0.4" />

    <!-- Mirror Tiles Reflective Highlights (Grid Blocks) -->
    <rect x="75" y="80" width="12" height="10" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="90" y="78" width="13" height="11" rx="1" fill="#f8fafc" opacity="0.95" />
    <rect x="106" y="81" width="12" height="10" rx="1" fill="#ffffff" opacity="0.85" />
    <rect x="62" y="94" width="12" height="11" rx="1" fill="#ffffff" opacity="0.85" />
    <rect x="77" y="93" width="13" height="12" rx="1" fill="#ffffff" opacity="0.95" />
    <rect x="93" y="92" width="14" height="12" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="110" y="94" width="13" height="11" rx="1" fill="#e2e8f0" opacity="0.8" />

    <rect x="50" y="110" width="12" height="12" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="65" y="108" width="13" height="13" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="81" y="107" width="14" height="13" rx="1" fill="#ffffff" opacity="0.95" />
    <rect x="98" y="107" width="14" height="13" rx="1" fill="#f1f5f9" opacity="0.9" />

    <!-- Shadowed Tiles at bottom -->
    <rect x="75" y="150" width="13" height="11" rx="1" fill="#475569" opacity="0.6" />
    <rect x="91" y="152" width="14" height="11" rx="1" fill="#334155" opacity="0.7" />
    <rect x="108" y="149" width="13" height="11" rx="1" fill="#475569" opacity="0.6" />

    <!-- Gloss Specular Highlight Arc -->
    <path d="M 40 70 A 75 75 0 0 1 140 55 A 80 80 0 0 0 40 70 Z" fill="url(#gloss)" />

    <!-- Sparkling Sparkle Stars -->
    <g transform="translate(60, 65) scale(0.7)">
      <path d="M 10 0 L 12 7 L 19 10 L 12 13 L 10 20 L 8 13 L 1 10 L 8 7 Z" fill="#ffffff" />
    </g>
    <g transform="translate(135, 80) scale(0.6)">
      <path d="M 10 0 L 12 7 L 19 10 L 12 13 L 10 20 L 8 13 L 1 10 L 8 7 Z" fill="#ffffff" />
    </g>
    <g transform="translate(115, 140) scale(0.5)">
      <path d="M 10 0 L 12 7 L 19 10 L 12 13 L 10 20 L 8 13 L 1 10 L 8 7 Z" fill="#ffffff" opacity="0.8" />
    </g>
  </g>
</svg>
