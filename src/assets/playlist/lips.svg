<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <radialGradient id="lipGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#a4133c" />
    </radialGradient>

    <filter id="kissShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#800f2f" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#kissShadow)">
    <!-- Upper Lip -->
    <path d="M 12 42 C 22 28, 38 20, 52 30 C 60 34, 68 34, 76 30 C 90 20, 106 28, 116 42 C 104 40, 88 41, 74 46 C 64 50, 60 50, 54 46 C 40 41, 24 40, 12 42 Z" fill="url(#lipGrad)" />

    <!-- Upper Lip Texture Wrinkles -->
    <path d="M 32 32 Q 34 38 35 43" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 46 28 Q 48 36 49 44" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 64 34 Q 64 40 64 46" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 82 28 Q 80 36 79 44" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 96 32 Q 94 38 93 43" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Lower Lip -->
    <path d="M 16 48 C 30 52, 42 53, 54 53 C 66 53, 78 52, 92 48 C 105 58, 86 78, 64 78 C 42 78, 23 58, 16 48 Z" fill="url(#lipGrad)" />

    <!-- Lower Lip Texture Wrinkles & Curves -->
    <path d="M 35 52 Q 38 62 42 72" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 52 53 Q 53 65 55 76" stroke="#800f2f" stroke-width="1.3" stroke-linecap="round" opacity="0.6" />
    <path d="M 64 53 Q 64 66 64 77" stroke="#800f2f" stroke-width="1.3" stroke-linecap="round" opacity="0.6" />
    <path d="M 76 53 Q 75 65 73 76" stroke="#800f2f" stroke-width="1.3" stroke-linecap="round" opacity="0.6" />
    <path d="M 93 52 Q 90 62 86 72" stroke="#800f2f" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Lip Gloss Highlights -->
    <ellipse cx="44" cy="62" rx="7" ry="3" fill="#ffffff" opacity="0.4" transform="rotate(-15 44 62)" />
    <ellipse cx="78" cy="63" rx="6" ry="2.5" fill="#ffffff" opacity="0.4" transform="rotate(15 78 63)" />
    <ellipse cx="64" cy="36" rx="4" ry="1.5" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
