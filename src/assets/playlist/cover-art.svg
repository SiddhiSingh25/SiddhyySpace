  <ellipse cx="151" cy="146" rx="128" ry="83" stroke="#7096e8" stroke-width="1.2" fill="none" opacity="0.6" transform="rotate(-4 151 146)" stroke-linecap="round" />

  <!-- Handwritten Text "feel worthy" -->
