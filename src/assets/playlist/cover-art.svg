  <text x="65" y="185" fill="#5882e6" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">worthy</text>

  <!-- Little Heart Doodle after "worthy" -->
