    <path d="M 12 20 C 4 13, 0 6, 7 2 C 12 -1, 15 4, 15 4 C 15 4, 18 -1, 23 2 C 30 6, 26 13, 15 20 Z" fill="#5882e6" stroke="#5882e6" stroke-width="1.5" stroke-linejoin="round" />
  </g>
