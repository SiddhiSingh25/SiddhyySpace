<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" fill="none">
  <defs>
    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="silverFacet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <filter id="starShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#starShadow)">
    <!-- Star 1: Top Right (Medium Star) -->
    <g transform="translate(65, 10) rotate(15, 30, 30)">
      <!-- White Sticker Edge -->
      <path d="M 30 0 Q 33 23 55 30 Q 33 37 30 60 Q 27 37 5 30 Q 27 23 30 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" stroke-linejoin="round" />
      <!-- Silver Star Body -->
      <path d="M 30 3 Q 33 24 52 30 Q 33 36 30 57 Q 27 36 8 30 Q 27 24 30 3 Z" fill="url(#silverGrad)" />
      <!-- Facet line overlay for 3D bevel look -->
      <path d="M 30 3 L 30 57 M 8 30 L 52 30" stroke="url(#silverFacet)" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Star 2: Main Bottom Left (Large Star) -->
    <g transform="translate(10, 50) rotate(-10, 40, 40)">
      <!-- White Sticker Edge -->
      <path d="M 40 0 Q 44 31 75 40 Q 44 49 40 80 Q 36 49 5 40 Q 36 31 40 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="5" stroke-linejoin="round" />
      <!-- Silver Star Body -->
      <path d="M 40 4 Q 44 32 71 40 Q 44 48 40 76 Q 36 48 9 40 Q 36 32 40 4 Z" fill="url(#silverGrad)" />
      <!-- Facet line overlay -->
      <path d="M 40 4 L 40 76 M 9 40 L 71 40" stroke="url(#silverFacet)" stroke-width="2" opacity="0.85" />
      <!-- Center Glint -->
      <circle cx="40" cy="40" r="3" fill="#ffffff" />
    </g>

    <!-- Star 3: Bottom Right (Small Star) -->
    <g transform="translate(80, 75) rotate(22, 20, 20)">
      <!-- White Sticker Edge -->
      <path d="M 20 0 Q 22 15 38 20 Q 22 25 20 40 Q 18 25 2 20 Q 18 15 20 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round" />
      <!-- Silver Star Body -->
      <path d="M 20 2 Q 22 16 36 20 Q 22 24 20 38 Q 18 24 4 20 Q 18 16 20 2 Z" fill="url(#silverGrad)" />
      <!-- Facet line overlay -->
      <path d="M 20 2 L 20 38 M 4 20 L 36 20" stroke="url(#silverFacet)" stroke-width="1.2" opacity="0.75" />
    </g>
  </g>
</svg>
