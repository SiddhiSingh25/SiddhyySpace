<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150" fill="none">
  <defs>
    <!-- Plastic Body Gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="20%" stop-color="#334155" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Chrome Sticker Gradient -->
    <linearGradient id="chromeSticker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="15%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Tape Ribbon Brown Gradient -->
    <linearGradient id="tapeRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="cassetteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#090d16" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#cassetteShadow)">
    <!-- Outer Plastic Cassette Shell -->
    <rect x="6" y="6" width="228" height="138" rx="10" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Bevel Inner Border Line -->
    <rect x="10" y="10" width="220" height="130" rx="8" stroke="#334155" stroke-width="1" fill="none" />

    <!-- Corner Screw Holes (Metallic Screws) -->
    <circle cx="16" cy="16" r="3.5" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <line x1="14.5" y1="14.5" x2="17.5" y2="17.5" stroke="#1e293b" stroke-width="1" />

    <circle cx="224" cy="16" r="3.5" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <line x1="222.5" y1="14.5" x2="225.5" y2="17.5" stroke="#1e293b" stroke-width="1" />

    <circle cx="16" cy="134" r="3.5" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <line x1="14.5" y1="132.5" x2="17.5" y2="135.5" stroke="#1e293b" stroke-width="1" />

    <circle cx="224" cy="134" r="3.5" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <line x1="222.5" y1="132.5" x2="225.5" y2="135.5" stroke="#1e293b" stroke-width="1" />

    <!-- Main Label Sticker (Upper Header) -->
    <rect x="22" y="20" width="196" height="78" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Blue Top Chrome Band -->
    <rect x="22" y="20" width="196" height="18" fill="url(#chromeSticker)" />
    <!-- Brand & Tape Spec Text -->
    <text x="30" y="33" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="10" letter-spacing="1">POSITION CHROME</text>
    <rect x="180" y="23" width="30" height="12" rx="2" fill="#0f172a" />
    <text x="187" y="32" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="9">90</text>

    <!-- Side A / B Circle -->
    <circle cx="36" cy="50" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <text x="32.5" y="54" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="11">A</text>

    <!-- Handwritten lines on label -->
    <line x1="52" y1="46" x2="204" y2="46" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />
    <line x1="52" y1="56" x2="204" y2="56" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2" />

    <!-- Transparent Tape Window Cutout -->
    <rect x="58" y="65" width="124" height="26" rx="4" fill="#090d16" stroke="#475569" stroke-width="1.5" />

    <!-- Brown Magnetic Tape Visible inside Window -->
    <rect x="62" y="68" width="116" height="20" fill="url(#tapeRibbon)" opacity="0.9" />

    <!-- Left Reel & Pack -->
    <circle cx="85" cy="78" r="15" fill="#451a03" />
    <circle cx="85" cy="78" r="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Reel Teeth Spokes -->
    <circle cx="85" cy="78" r="5" fill="#0f172a" />
    <rect x="83.5" y="70" width="3" height="16" fill="#cbd5e1" />
    <rect x="77" y="76.5" width="16" height="3" fill="#cbd5e1" />

    <!-- Right Reel & Pack -->
    <circle cx="155" cy="78" r="12" fill="#451a03" />
    <circle cx="155" cy="78" r="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Reel Teeth Spokes -->
    <circle cx="155" cy="78" r="5" fill="#0f172a" />
    <rect x="153.5" y="70" width="3" height="16" fill="#cbd5e1" />
    <rect x="147" y="76.5" width="16" height="3" fill="#cbd5e1" />

    <!-- Window Ruler Marks -->
    <line x1="100" y1="66" x2="100" y2="70" stroke="#f8fafc" stroke-width="1" opacity="0.6" />
    <line x1="120" y1="66" x2="120" y2="72" stroke="#f8fafc" stroke-width="1.2" opacity="0.8" />
    <line x1="140" y1="66" x2="140" y2="70" stroke="#f8fafc" stroke-width="1" opacity="0.6" />

    <!-- Bottom Trapezoid Reader Notch -->
    <polygon points="40,144 60,104 180,104 200,144" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

    <!-- Reader Holes -->
    <circle cx="76" cy="124" r="5" fill="#090d16" stroke="#64748b" stroke-width="1" />
    <circle cx="164" cy="124" r="5" fill="#090d16" stroke="#64748b" stroke-width="1" />
    <rect x="96" y="116" width="48" height="16" rx="2" fill="#090d16" stroke="#64748b" stroke-width="1" />

    <line x1="60" y1="104" x2="180" y2="104" stroke="#64748b" stroke-width="1" />
  </g>
</svg>
